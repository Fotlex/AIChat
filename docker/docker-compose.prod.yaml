services:
  db:
    image: postgres:17-alpine
    container_name: aichat-db
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: prod
    container_name: aichat-backend
    command: granian --interface asgi --host 0.0.0.0 --port 8000 --workers 2 config.asgi:application
    volumes:
      - static-volume:/app/static_root
      - media-volume:/app/media
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend-builder:
    profiles: ["tools"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod-exporter
    container_name: aichat-frontend-builder
    volumes:
      - frontend-dist:/frontend_static
    env_file:
      - ../frontend/.env

  nginx:
    image: nginx:1.27.5-alpine
    container_name: aichat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/convert_env.sh:/docker-entrypoint.d/01-convert_env.sh:ro
      - static-volume:/app/backend/static_root:ro
      - media-volume:/app/backend/media:ro
      - frontend-dist:/var/www/frontend:ro
      - ../ssl:/etc/letsencrypt:ro
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  static-volume:
  media-volume:
  frontend-dist:
