upstream django_app {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name ${ALLOWED_HOSTS};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${ALLOWED_HOSTS};

    ssl_certificate /etc/letsencrypt/live/${ALLOWED_HOSTS}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${ALLOWED_HOSTS}/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location ~ ^/(api|admin)/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_pass http://django_app;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/backend/static_root/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        alias /var/www/frontend/;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location /assets/ {
        alias /var/www/frontend/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}