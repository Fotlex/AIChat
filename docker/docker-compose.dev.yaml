services:
  db:
    image: postgres:17-alpine
    container_name: aichat-db
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aichat-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v6.6.0
    container_name: aichat-centrifugo
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c /centrifugo/config.json
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - CENTRIFUGO_HTTP_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_HMAC_SECRET}
      - CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=${CENTRIFUGO_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "centrifugo", "check"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    container_name: aichat-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
      - static-volume:/app/static_root
      - media-volume:/app/media
    expose:
      - 8000
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    container_name: aichat-celery-worker
    command: celery -A config worker -l INFO -P gevent -c 100
    volumes:
      - ../backend:/app
      - media-volume:/app/media
    env_file:
      - ../.env
    environment:
      - CELERY_POOL_CLASS=gevent
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    container_name: aichat-celery-beat
    command: celery -A config beat -l INFO
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aichat-frontend
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../frontend:/app
      - node-modules:/app/node_modules
    expose:
      - 5173
    env_file:
      - ../.env
    depends_on:
      - backend
    stdin_open: true
    tty: true

  nginx:
    image: nginx:1.27.5-alpine
    container_name: aichat-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/templates/default.conf.template:ro
      - static-volume:/app/backend/static_root:ro
      - media-volume:/app/backend/media:ro
    env_file: ../.env
    environment:
      NGINX_PORT: 80
      BACKEND_PORT: 8000
      FRONTEND_PORT: 5173
      CENTRIFUGO_PORT: 8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  static-volume:
  media-volume:
  node-modules:
