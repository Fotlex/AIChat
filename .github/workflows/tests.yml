name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install Dependencies
        working-directory: ./backend
        run: poetry install --no-root
      - name: Run Pytest
        working-directory: ./backend
        env:
          DJANGO_SECRET_KEY: "ci-secret-key"
          POSTGRES_DB: test_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          TIMEZONE: UTC
          DEBUG: True
          ALLOWED_HOSTS: "*"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          YOOKASSA_SHOP_ID: "000"
          YOOKASSA_SECRET_KEY: "mock"
          APP_URL: "http://localhost"
        run: poetry run pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run Vitest
        working-directory: ./frontend
        run: npm run test -- --run

  deploy:
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd AIChat
            
            PREV_COMMIT=$(git rev-parse HEAD)
            
            git pull origin ${{ github.ref_name }}
            
            # git diff --quiet возвращает 0, если изменений НЕТ
            if git diff --quiet $PREV_COMMIT HEAD -- frontend/; then
              echo ">>> [INFO] Фронтенд не менялся. Пропускаем сборку статики."
            else
              echo ">>> [BUILD] Обнаружены изменения во фронтенде. Запускаем билд..."
              make prod-build-front
            fi
            
            make prod-up
            make prod-migrate
            make prod-static
