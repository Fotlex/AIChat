[project]
name = "aichat"
version = "0.1.0"
description = ""
authors = [
    {name = "miderror", email = "miderror.dev@gmail.com"},
    {name = "Fotlex", email = "kudron02@mail.ru"}
]
package-mode = false
requires-python = ">=3.12, <4.0"
dependencies = [
    "django (>=5.2.6,<6.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "orjson (>=3.11.5,<4.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "granian (>=2.7.1,<3.0.0)",
    "psycopg[binary,pool] (>=3.3.4,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "yookassa (>=3.10.1,<4.0.0)",
    "openai (>=2.38.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0, <3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "watchfiles (>=1.2.0,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
